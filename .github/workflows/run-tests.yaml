name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up environment file
        run: |
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "POSTGRES_USER=test" >> .env
          echo "POSTGRES_PASSWORD=test" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "JWT_SECRET=test_jwt_secret" >> .env
          echo "JWT_EXPIRATION_MINUTES=60" >> .env

      - name: Install Go dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test -count=1 ./internal/... -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fresh Postgres per test via testcontainers (not a shared / dirty database).
      # POSTGRES_* and DB_PORT are required by tests/setupPostgreSQLContainer.
      # CLOUDINARY_* is required: product image integration tests assert real Cloudinary URLs
      # (without them the image service falls back to /uploads/ and those tests fail).
      - name: Require Cloudinary secrets
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -z "$CLOUDINARY_CLOUD_NAME" ] || [ -z "$CLOUDINARY_API_KEY" ] || [ -z "$CLOUDINARY_API_SECRET" ]; then
            echo "Set repository secrets CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, and CLOUDINARY_API_SECRET."
            exit 1
          fi

      - name: Set up environment file
        run: |
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
          echo "DB_PORT=5432" >> .env
          echo "POSTGRES_USER=test" >> .env
          echo "POSTGRES_PASSWORD=test" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "JWT_SECRET=test_jwt_secret" >> .env
          echo "JWT_EXPIRATION_MINUTES=60" >> .env
          echo "APP_BASE_URL=http://localhost:5173" >> .env

      - name: Install Go dependencies
        run: go mod tidy

      - name: Run integration tests
        run: go test -timeout 15m -count=1 ./tests

  # Branch protection still requires the old job id "test". Report after unit + integration.
  test:
    needs: [unit, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require unit and integration success
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ]; then
            echo "unit=${{ needs.unit.result }} integration=${{ needs.integration.result }}"
            exit 1
          fi
