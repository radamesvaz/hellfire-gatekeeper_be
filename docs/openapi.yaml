openapi: 3.0.3
info:
  title: Hellfire Gatekeeper API — Listados (productos y órdenes)
  version: 1.0.0
  license:
    name: Proprietary
    url: https://github.com/radamesvaz/bakery-app
  description: |
    Contrato de **paginación por cursor** y **búsqueda/filtros** para listados públicos de catálogo y listado autenticado de pedidos.

    ## Respuesta de listado (envelope)

    Todos los endpoints de listado devuelven un **objeto JSON** (no un array en la raíz):

    ```json
    { "items": [ ... ], "next_cursor": "<string | null>" }
    ```

    - `items`: filas de la página actual.
    - `next_cursor`: si es **no nulo**, hay más resultados; en la siguiente petición envía el mismo valor en el query param `cursor`. Si es **null**, no hay página siguiente.

    ## Regla al cambiar filtros de búsqueda

    Si cambias **`q`** (productos) o **`id_user`** / **`status`** / **`ignore_status`** (órdenes), **no reutilices** un `cursor` obtenido con otra combinación de parámetros. Vuelve a llamar **sin** `cursor` (primera página del nuevo filtro).

    ## Formatos de cursor (distintos por recurso)

    **Productos:** cursor opaco **versión 1**, keyset sobre `id_product` descendente. Solo aplica al listado de productos.

    **Órdenes:** cursor opaco **versión 3**, keyset sobre `(created_on DESC, id_order DESC)` (más recientes primero). **No** es intercambiable con el de productos ni con cursores v2.

    El cliente debe tratar `cursor` y `next_cursor` como **cadenas opacas** (p. ej. Base64-URL); no dependas de su estructura interna.

    ## Errores HTTP 400

    El servidor suele responder con cuerpo **text/plain** (mensaje breve), no JSON. Casos frecuentes:

    - `limit` fuera de rango (debe ser 1–100; si se omite, default 20).
    - `cursor` inválido o corrupto.
    - `q` presente pero con menos de **2** caracteres (tras quitar espacios).
    - `id_user` no numérico o **0**.
    - `status` en órdenes con valor que no coincide con el enum de estado del pedido.

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Origen del API (sin barra final)

tags:
  - name: Catalog
    description: Catálogo de productos (público o multi-tenant por ruta)
  - name: Orders
    description: |
      Pedidos: create público (storefront) y gestión admin (`/auth/orders*`).
      Admin requiere JWT **admin/superadmin** y suscripción no `canceled`.

paths:
  /products:
    get:
      security: []
      tags: [Catalog]
      summary: Listar productos (legacy / tenant por cabecera)
      description: |
        Listado paginado de productos **activos** únicamente (catálogo público).
        Resuelve el tenant con la cabecera `X-Tenant-Slug`
        (mismo middleware que `GET /t/{tenant_slug}/products`).
        Orden: **`id_product` descendente** (más alto primero).
        Para listar inactive/deleted (admin), usa `GET /auth/products`.
      operationId: listProductsLegacy
      parameters:
        - name: X-Tenant-Slug
          in: header
          required: true
          schema:
            type: string
          example: default
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CursorProducts"
        - $ref: "#/components/parameters/QueryQ"
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              examples:
                firstPage:
                  summary: Primera página
                  value:
                    items:
                      - id_product: 2
                        tenant_id: 1
                        name: Suspiros
                        description: ""
                        price: 5
                        track_inventory: true
                        stock: 2
                        status: active
                        image_urls: []
                        thumbnail_url: ""
                        created_on: "2025-04-14T10:00:00Z"
                    next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequestText"

  /t/{tenant_slug}/products:
    get:
      security: []
      tags: [Catalog]
      summary: Listar productos por tenant (slug en ruta)
      description: |
        Mismo contrato que `GET /products` (solo productos `active`).
        Resuelve el tenant por `tenant_slug` (y/o cabecera `X-Tenant-Slug` según middleware).
        Para administración (todos los estados), usa `GET /auth/products`.
      operationId: listProductsByTenantSlug
      parameters:
        - name: tenant_slug
          in: path
          required: true
          schema:
            type: string
          example: default
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CursorProducts"
        - $ref: "#/components/parameters/QueryQ"
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "404":
          description: Tenant no encontrado (cuando aplica)

  /auth/products:
    get:
      tags: [Catalog]
      summary: Listar productos (admin, todos los estados)
      description: |
        Listado paginado para administración. Incluye `active`, `inactive` y `deleted`.
        Requiere **Bearer JWT** con rol admin o superadmin.
        Orden: **`id_product` descendente** (más alto primero).
      operationId: listProductsAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CursorProducts"
        - $ref: "#/components/parameters/QueryQ"
      responses:
        "200":
          description: Página de productos (cualquier status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "401":
          description: JWT ausente o inválido
        "403":
          description: Rol insuficiente (no admin/superadmin)

  /auth/products/{id}:
    get:
      tags: [Catalog]
      summary: Obtener producto por ID (admin, cualquier estado)
      description: |
        Devuelve el producto aunque esté `inactive` o `deleted`.
        Requiere **Bearer JWT** con rol admin o superadmin.
      operationId: getProductByIdAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: JWT ausente o inválido
        "403":
          description: Rol insuficiente (no admin/superadmin)
        "404":
          description: Producto no encontrado

  /auth/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos (admin)
      description: |
        Requiere **Bearer JWT** de **admin o superadmin**, tenant operable en contexto, y suscripción no `canceled`.
        Orden: **`created_on` descendente**, desempate **`id_order` descendente** (más recientes primero).

        ### Transiciones de estado (PATCH)
        Lineales: `pending → preparing → ready → delivered`.
        `cancelled` solo desde `pending|preparing|ready` (restaura stock rastreado).
        `deleted` solo desde `cancelled|expired|delivered` (no toca stock).
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CursorOrders"
        - $ref: "#/components/parameters/QueryQOrders"
        - name: ignore_status
          in: query
          description: Si `true`, no se excluyen pedidos con estado `deleted` por defecto.
          schema:
            type: boolean
        - name: status
          in: query
          description: Filtra por estado exacto (enum). Si se envía, interacciona con `ignore_status` según lógica del servidor.
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: id_user
          in: query
          description: Filtra pedidos cuyo `id_user` coincide. Entero positivo.
          schema:
            type: integer
            minimum: 1
            format: int64
          example: 2
      responses:
        "200":
          description: Página de pedidos con ítems anidados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "401":
          description: Sin token o token inválido
        "403":
          description: Rol insuficiente (no admin/superadmin) o suscripción cancelada

  /auth/orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener pedido por ID (admin)
      description: |
        Requiere **Bearer JWT** de **admin o superadmin**.
        Suscripción `canceled` → 403.
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Pedido con ítems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListItem"
        "401":
          description: Sin token o token inválido
        "403":
          description: Rol insuficiente o suscripción cancelada
        "404":
          description: Pedido no encontrado
    patch:
      tags: [Orders]
      summary: Actualizar estado y/ o pago (admin)
      description: |
        Requiere **Bearer JWT** de **admin o superadmin**.

        ### Transiciones de `status` permitidas
        - Lineales: `pending → preparing → ready → delivered`
        - Cancelar: `pending|preparing|ready → cancelled` (restaura stock rastreado)
        - Soft-delete: `cancelled|expired|delivered → deleted` (no toca stock)

        Saltos, retrocesos, `delivered → cancelled` y delete prematuro → **400**.
        `expired` solo lo escribe el worker de ghost orders.
      operationId: updateOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
            examples:
              nextStep:
                value:
                  status: preparing
              cancel:
                value:
                  status: cancelled
                  cancellation_reason: Cliente canceló
              markPaid:
                value:
                  paid: true
      responses:
        "200":
          description: Actualización correcta (mensaje texto o vacío según handler)
        "400":
          description: Payload inválido o transición de estado no permitida
        "401":
          description: Sin token o token inválido
        "403":
          description: Rol insuficiente o suscripción cancelada
        "404":
          description: Pedido no encontrado

  /orders:
    post:
      security: []
      tags: [Orders]
      summary: Crear pedido (legacy / tenant por cabecera)
      description: |
        Create de storefront. Resuelve tenant con `X-Tenant-Slug`.
        Si la suscripción del tenant es `canceled` (u otras condiciones de
        disponibilidad), el middleware de tenant responde **404**.
        Éxito: **201** con `id_order`.
        `delivery_date` en `YYYY-MM-DD`; **hoy permitido** (día calendario local ≥ hoy).
      operationId: createOrderLegacy
      parameters:
        - name: X-Tenant-Slug
          in: header
          required: true
          schema:
            type: string
          example: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Validación / fecha / tenant ausente
        "404":
          description: Tenant no disponible o producto no encontrado
        "409":
          description: Producto no comprable o stock insuficiente

  /t/{tenant_slug}/orders:
    post:
      security: []
      tags: [Orders]
      summary: Crear pedido por tenant (slug en ruta)
      description: |
        Mismo contrato que `POST /orders` (legacy). Preferido para multi-tenant.
      operationId: createOrderByTenantSlug
      parameters:
        - name: tenant_slug
          in: path
          required: true
          schema:
            type: string
          example: default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Validación / fecha
        "404":
          description: Tenant no disponible o producto no encontrado
        "409":
          description: Producto no comprable o stock insuficiente

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Tamaño de página. Por defecto **20**. Máximo **100**.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CursorProducts:
      name: cursor
      in: query
      description: Cursor opaco (productos, v1). Omitir en la primera página.
      schema:
        type: string
    CursorOrders:
      name: cursor
      in: query
      description: Cursor opaco (órdenes, v3). Omitir en la primera página. **No** usar el cursor de productos ni cursores v2.
      schema:
        type: string
    QueryQ:
      name: q
      in: query
      description: |
        Coincidencia por **nombre contiene** (substring), **insensible a mayúsculas**. Mínimo **2** caracteres si se envía.
        Omitir o vacío = sin filtro por nombre.
      schema:
        type: string
        minLength: 2
      example: Su
    QueryQOrders:
      name: q
      in: query
      description: |
        Búsqueda insensible a mayúsculas en `user_name` y `email`.
        Si `q` es numérico, también intenta coincidencia exacta por `id_order`.
        Mínimo **2** caracteres si se envía.
      schema:
        type: string
        minLength: 2
      example: client@example.com

  responses:
    BadRequestText:
      description: Solicitud inválida (mensaje en texto plano)
      content:
        text/plain:
          schema:
            type: string
          example: limit must be between 1 and 100

  schemas:
    ProductListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          description: Siguiente página; null si no hay más.

    Product:
      type: object
      properties:
        id_product:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        track_inventory:
          type: boolean
          description: |
            When true, stock is decremented on order create and reverted on admin cancel.
            When false, stock is not enforced (unlimited / service-style products).
        stock:
          type: integer
          format: int64
        status:
          type: string
          description: |
            Product lifecycle. Public catalog endpoints only return `active`.
            `inactive` hides from catalog but keeps the product; `deleted` soft-deletes
            (admin may also clean up images).
          enum: [active, inactive, deleted]
        image_urls:
          type: array
          items:
            type: string
        thumbnail_url:
          type: string
        created_on:
          type: string
          format: date-time
          nullable: true

    OrderListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderListItem"
        next_cursor:
          type: string
          nullable: true

    OrderListItem:
      type: object
      description: Misma forma que la respuesta de detalle de pedido en listados.
      properties:
        id_order:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        id_user:
          type: integer
          format: int64
        user_name:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        total_price:
          type: number
          format: double
        note:
          type: string
        delivery_direction:
          type: string
        OrderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        created_on:
          type: string
          format: date-time
        delivery_date:
          type: string
          format: date-time
        paid:
          type: boolean
        expires_at:
          type: string
          format: date-time
        cancellation_reason:
          type: string
          nullable: true

    OrderLineItem:
      type: object
      properties:
        id_order_item:
          type: integer
          format: int64
        id_order:
          type: integer
          format: int64
        id_product:
          type: integer
          format: int64
        name:
          type: string
        unit_price:
          type: number
          format: double
        quantity:
          type: integer
          format: int64

    OrderStatus:
      type: string
      enum:
        - pending
        - preparing
        - ready
        - delivered
        - cancelled
        - expired
        - deleted

    CreateOrderItem:
      type: object
      required: [id_product, quantity]
      properties:
        id_product:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int64
          minimum: 1

    CreateOrderRequest:
      type: object
      required: [name, email, phone, delivery_date, delivery_direction, items]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        delivery_date:
          type: string
          description: Fecha calendario `YYYY-MM-DD`. Hoy permitido; días pasados → 400.
          example: "2026-07-27"
        delivery_direction:
          type: string
          description: Dirección o enlace de entrega
        note:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItem"

    CreateOrderResponse:
      type: object
      required: [message, id_order]
      properties:
        message:
          type: string
          example: Order created successfully
        id_order:
          type: integer
          format: int64
          example: 42

    UpdateOrderRequest:
      type: object
      description: Al menos uno de `status` o `paid` es obligatorio.
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        paid:
          type: boolean
        cancellation_reason:
          type: string
